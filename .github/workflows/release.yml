name: Release plugin

# Publishing a version tag builds the plugin ZIP and attaches it to a GitHub
# Release. The plugin's built-in updater watches that release, so the live site
# picks the new version up on its own.
#
#   git tag v1.4.0 && git push origin v1.4.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        # WordPress reads the version from the plugin header, while the updater
        # compares against the constant. If either disagrees with the tag, the
        # site would be offered an "update" that never resolves — so fail here
        # rather than ship a release that nags forever.
        run: |
          set -euo pipefail
          PLUGIN_FILE=bethel-gala-tickets/bethel-gala-tickets.php
          TAG="${GITHUB_REF_NAME#v}"

          HEADER_VERSION=$(sed -n "s/^ \* Version:[[:space:]]*\(.*\)$/\1/p" "$PLUGIN_FILE" | head -1 | tr -d '[:space:]')
          CONST_VERSION=$(sed -n "s/.*BLC_GALA_VERSION'[[:space:]]*,[[:space:]]*'\([^']*\)'.*/\1/p" "$PLUGIN_FILE" | head -1)

          echo "tag=$TAG  header=$HEADER_VERSION  constant=$CONST_VERSION"

          if [ "$TAG" != "$HEADER_VERSION" ]; then
            echo "::error::Tag $TAG does not match the plugin header version $HEADER_VERSION"
            exit 1
          fi
          if [ "$TAG" != "$CONST_VERSION" ]; then
            echo "::error::Tag $TAG does not match BLC_GALA_VERSION $CONST_VERSION"
            exit 1
          fi

      - name: Check PHP syntax
        run: |
          set -euo pipefail
          find bethel-gala-tickets -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "PHP syntax OK"

      - name: Build the plugin zip
        # The archive must unpack to a folder named exactly bethel-gala-tickets,
        # because WordPress drops that folder straight into wp-content/plugins.
        # GitHub's own source archive wraps everything in a repo-named folder,
        # which is why the ZIP is built by hand here.
        run: |
          set -euo pipefail
          mkdir -p build
          cp -r bethel-gala-tickets build/bethel-gala-tickets
          cd build
          zip -rq ../bethel-gala-tickets.zip bethel-gala-tickets \
            -x '*.DS_Store' '*/.git/*' '*/node_modules/*'
          cd ..
          unzip -l bethel-gala-tickets.zip | head -5

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: bethel-gala-tickets.zip
          generate_release_notes: true
